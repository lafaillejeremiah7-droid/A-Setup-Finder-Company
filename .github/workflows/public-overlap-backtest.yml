name: Public overlap backtest

on:
  push:
    branches: [feature/data-foundation]
    paths:
      - 'scripts/run_public_overlap_backtest.py'
      - 'src/backtest/**'
      - 'src/market/**'
      - 'src/risk/**'
      - 'src/signal/**'
      - '.github/workflows/public-overlap-backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas 'histdatacom==1.3.4'

      - name: Download free U.S. Dollar Index proxy history
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p histdata_downloads
          cd histdata_downloads
          histdatacom -p udxusd -f ascii -t 1-minute-bar-quotes -s 2026-01 -e 2026-04 -D -X
          echo 'Downloaded files:'
          find . -maxdepth 6 -type f | head -100

      - name: Run GIBRC public-overlap backtest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_public_overlap_backtest.py \
            --dxy-root "${{ runner.temp }}/histdata_downloads" \
            --out-dir backtest_artifact

      - name: Upload backtest trades
        uses: actions/upload-artifact@v4
        with:
          name: public-overlap-backtest
          path: backtest_artifact/
          if-no-files-found: error
          retention-days: 14
