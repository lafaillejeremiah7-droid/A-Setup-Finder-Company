name: Fast core backtest

on:
  push:
    branches: [feature/data-foundation]
    paths:
      - 'scripts/run_fast_core_backtest.py'
      - 'src/backtest/**'
      - 'src/market/**'
      - 'src/risk/**'
      - 'src/signal/**'
      - '.github/workflows/fast-core-backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas
      - name: Run fast core backtest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_fast_core_backtest.py
      - name: Upload core backtest
        uses: actions/upload-artifact@v4
        with:
          name: fast-core-backtest
          path: fast_core_artifact/
          if-no-files-found: error
          retention-days: 14
